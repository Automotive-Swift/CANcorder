[metadata]
name = cancorder-utils
version = 0.1.2
description = CANcorder ECUconnect logger utilities and protocol helpers.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Mickey Lauer

[options]
packages = find:
python_requires = >=3.10
install_requires =
    python-can>=4.2.2
    zeroconf>=0.132.0

[options.extras_require]
gs_usb =
    gs_usb
serial =
    pyserial>=3.5

[options.entry_points]
console_scripts =
    cancorder-canlogger = cancorder_utils.canlogger:main
    cancorder-rusoku-canlogger = cancorder_utils.rusoku_canlogger:main
    cancorder-mock-uds-canlogger = cancorder_utils.mock_uds_canlogger:main
